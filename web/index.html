// Blend two open tables into a new dataset. The overlap probe is a preview here, not the product —
// the product is the joined view that lands in the sidebar.
async function showMerge(preLeft) {
  if (state.tables.length < 2) return toast("Open at least two tables to merge them.");
  const opt = (sel) => state.tables.map((t) =>
    `<option value="${esc(t.table)}" ${t.table === sel ? "selected" : ""}>${esc(t.table)}</option>`).join("");
  const left0 = preLeft || state.active || state.tables[0].table;
  const right0 = state.tables.find((t) => t.table !== left0)?.table;
  const h = `<h3>Merge tables</h3>
    <div class="sub">Join two tables into a new dataset. It appears in the sidebar as a view —
    instant, no copy — and you can explore or export it like any other source.</div>
    <div class="row">
      <select id="mg-l" style="padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel)">${opt(left0)}</select>
      <select id="mg-how" style="padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel)">
        <option value="inner">inner join</option><option value="left">left join</option>
        <option value="right">right join</option><option value="full">full join</option></select>
      <select id="mg-r" style="padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel)">${opt(right0)}</select>
    </div>
    <div id="mg-keys"></div>
    <div class="row"><input type="text" id="mg-name" placeholder="new table name (optional)"></div>
    <div id="mg-preview"></div>
    <div class="row"><span style="flex:1"></span>
      <button class="btn" id="mg-cancel">Cancel</button>
      <button class="btn primary" id="mg-go" disabled>Merge →</button></div>`;
  const m = modal(h, true);
  m.querySelector("#mg-cancel").onclick = () => m.remove();
  const keysBox = m.querySelector("#mg-keys");
  const preview = m.querySelector("#mg-preview");
  const goBtn = m.querySelector("#mg-go");

  const pickedKeys = () => [...keysBox.querySelectorAll("[data-k]:checked")].map((x) => x.dataset.k);

  async function loadKeys() {
    const left = m.querySelector("#mg-l").value, right = m.querySelector("#mg-r").value;
    preview.innerHTML = "";
    goBtn.disabled = true;
    if (left === right) { keysBox.innerHTML = `<div class="sub">Pick two different tables.</div>`; return; }
    try {
      const d = await api(`/api/joincols?left=${encodeURIComponent(left)}&right=${encodeURIComponent(right)}`);
      if (!d.candidates.length) {
        keysBox.innerHTML = `<div class="sub">These two share no column names — nothing to join on.</div>`;
        return;
      }
      keysBox.innerHTML = `<div class="sub">Join on — tick one or more keys:</div>` +
        d.candidates.map((c) => `<label class="col-row" style="cursor:pointer">
          <input type="checkbox" data-k="${esc(c.col)}" ${c.compatible ? "" : "disabled"}>
          <span class="cn">${esc(c.col)}</span>
          <span class="ct">${esc(c.left_type)} / ${esc(c.right_type)}</span>
          ${c.compatible ? "" : '<span class="cd" style="color:var(--stale)">type mismatch</span>'}
          </label>`).join("");
      keysBox.querySelectorAll("[data-k]").forEach((cb) => (cb.onchange = probe));
    } catch (e) { fail(e); }
  }

  async function probe() {
    const left = m.querySelector("#mg-l").value, right = m.querySelector("#mg-r").value;
    const on = pickedKeys();
    goBtn.disabled = on.length === 0;
    if (!on.length) { preview.innerHTML = ""; return; }
    try {
      const r = await post("/api/join_probe", { left, right, on });
      preview.innerHTML = `<div class="code">${fmtInt(r.matched)} of ${fmtInt(r.left_distinct)}` +
        ` distinct ${on.join(" + ")} in ${esc(left)} match ${esc(right)} → ${pct(r.pct)}` +
        `${r.unmatched ? `\n${fmtInt(r.unmatched)} unmatched (kept only by a left/full join)` : ""}</div>`;
    } catch (e) { fail(e); }
  }

  m.querySelector("#mg-l").onchange = loadKeys;
  m.querySelector("#mg-r").onchange = loadKeys;
  goBtn.onclick = async () => {
    try {
      const t = await post("/api/merge", {
        left: m.querySelector("#mg-l").value, right: m.querySelector("#mg-r").value,
        on: pickedKeys(), how: m.querySelector("#mg-how").value,
        name: m.querySelector("#mg-name").value.trim() || null,
      });
      m.remove();
      await refreshState();
      await selectTable(t.table, true);
      toast(`Merged into ${t.table} — ${fmtInt(t.rows.value)} rows`);
    } catch (e) { fail(e); }
  };
  loadKeys();
}

/* --------------------------------------------------------------- opening */
async function openPath(path, sheet) {
  if (!path) return;
  try {
    const t = await post("/api/open", { path, sheet });
    await refreshState();
    await selectTable(t.table, true);
    toast(`Opened ${t.table}`);
  } catch (e) {
    // A workbook with several sheets is better answered with a picker than a guess.
    if (/\.xlsx?$/i.test(path) && !sheet) return maybeSheetPicker(path);
    fail(e);
  }
}
async function maybeSheetPicker(path) {
  try {
    const d = await api(`/api/sheets?path=${encodeURIComponent(path)}`);
    const h = `<h3>${esc(path.split("/").pop())}</h3>
      <div class="sub">${d.sheets.length} sheets — pick what to open.</div>` +
      d.sheets.map((s) => `<label class="col-row" style="cursor:pointer">
        <input type="checkbox" data-s="${esc(s.name)}" ${s.empty ? "disabled" : "checked"}>
        <span class="cn">${esc(s.name)}</span>
        <span class="cd">${s.empty ? "empty" : `${fmtInt(s.rows)} × ${s.cols}`}</span></label>`).join("") +
      `<div class="row"><span style="flex:1"></span><button class="btn" id="sh-x">Cancel</button>
       <button class="btn primary" id="sh-go">Open</button></div>`;
    const m = modal(h);
    m.querySelector("#sh-x").onclick = () => m.remove();
    m.querySelector("#sh-go").onclick = async () => {
      const names = [...m.querySelectorAll("[data-s]:checked")].map((x) => x.dataset.s);
      m.remove();
      for (const n of names) await openPath(path, n);
    };
  } catch (e) { fail(e); }
}

/* Called by the native shell (DropWebView / AppDelegate) with real filesystem paths — from an
   in-window drop, a Dock-icon drop, Finder "Open With", or File > Open. */
window.siftOpenPaths = async (paths) => {
  for (const p of paths || []) {
    if (/\.xlsx?$/i.test(p)) await maybeSheetPicker(p);
    else await openPath(p);
  }
};
// Drag feedback in both places it can show: the rail dropzone (browser) and the empty-state pane.
function setDropHint(on) {
  $("dropzone")?.classList.toggle("hot", on);
  $("gempty")?.classList.toggle("drop", on);
}
window.siftDragHint = (on) => setDropHint(!!on);   // called by the native shell during an AppKit drag

// Open a file: native uses NSOpenPanel via the shell; browser triggers a hidden <input type=file>.
function triggerOpen() {
  if (NATIVE && window.webkit?.messageHandlers?.sift) {
    window.webkit.messageHandlers.sift.postMessage({ type: "open" });
    return;
  }
  let inp = $("empty-file");
  if (!inp) {
    inp = document.createElement("input");
    inp.type = "file"; inp.id = "empty-file"; inp.style.display = "none";
    inp.onchange = () => { for (const f of inp.files) uploadFile(f); inp.value = ""; };
    document.body.appendChild(inp);
  }
  inp.click();
}

/* ---------------------------------------------------------------- native bridge
   In the shell, the chrome is AppKit: a vibrant sidebar and a unified toolbar. The page stays the
   single source of truth for engine state (it already has /api/state plus the SSE stream), and
   pushes what the native chrome needs to draw. Having Swift poll separately would give two views of
   the world that can disagree. */
const shell = () => (NATIVE ? window.webkit?.messageHandlers?.sift : null);

function pushNativeState() {
  const s = shell();
  if (!s) return;
  const t = state.tables.find((x) => x.table === state.active);
  let summary = "";
  if (t) {
    summary = `${rowText(t)} · ${t.n_cols} cols`;
    if (t.bad_rows) summary += ` · ${fmtInt(t.bad_rows)} dropped`;
  }
  s.postMessage({
    type: "state",
    active: state.active || null,
    rowSummary: summary,
    tables: state.tables.map((x) => ({
      name: x.table, fmt: x.fmt, size: x.size, rows: x.rows.value,
      unfiltered: x.rows.unfiltered ?? null, staged: !!x.staged,
      badRows: x.bad_rows || 0, path: x.path, subtitle: sourceSubtitle(x),
    })),
  });
}

/* Called from the native sidebar and toolbar. */
window.siftSelectTable = (name) => selectTable(name);
window.siftCloseTable = (name) => closeTable(name);
// Stage/unstage a specific file from the native row menu. Stage is a background job (SSE updates);
// unstage is immediate, so refresh and reload if it's the active table.
window.siftStage = async (name, on) => {
  try {
    if (on) { await post("/api/stage", { table: name, force: true }); toast("Staging…"); }
    else {
      await post("/api/unstage", { table: name });
      await refreshState();
      if (name === state.active) await loadTable();
      toast(`${name}: now reading from source`);
    }
  } catch (e) { fail(e); }
};
// The native sidebar picks a destination with NSSavePanel, then hands it here so the actual write
// goes through the one export path (and one toast) rather than a second HTTP client in Swift.
window.siftExport = async (table, dest, format) => {
  try {
    const d = await post("/api/export", { table, dest, format, overwrite: true });
    toast(`Wrote ${human(d.bytes)} to ${d.dest} in ${d.ms} ms`);
  } catch (e) { fail(e); }
};
window.siftAction = (what) => {
  if (what === "export") showExport();
  else if (what === "staged") showStaged();
  else if (what === "merge") showMerge();
  else if (what === "inspector") { open.insp = !open.insp; autoLayout(); }
  else if (what === "close" && state.active) closeTable(state.active);
};

async function uploadFile(file) {
  if (file.size > MAX_UPLOAD_MB * 1024 * 1024) {
    const gb = (file.size / 1024 ** 3).toFixed(1);
    const h = `<h3>${esc(file.name)} is ${gb} GB</h3>
      <div class="sub">The browser will not tell Sift where this file lives, so it would have to be
      copied first — about ${Math.round(file.size / (200 * 1024 * 1024))}s, and twice the disk.
      <br><br><b>Faster:</b> press <span class="kbd">⌥⌘C</span> on the file in Finder and paste the
      path below, or drop it on the Sift app icon. Either reads it in place, instantly.</div>
      <div class="row"><input type="text" id="up-path" placeholder="/Users/you/data/${esc(file.name)}">
        <button class="btn primary" id="up-open">Open</button></div>
      <div class="row"><span style="flex:1"></span>
        <button class="btn" id="up-cancel">Cancel</button></div>`;
    const m = modal(h);
    m.querySelector("#up-cancel").onclick = () => m.remove();
    m.querySelector("#up-open").onclick = () => {
      const p = m.querySelector("#up-path").value.trim();
      m.remove(); openPath(p);
    };
    return;
  }
  toast(`Copying ${file.name} (${human(file.size)})…`);
  const fd = new FormData();
  fd.append("file", file);
  fd.append("size", String(file.size));
  try {
    const res = await fetch("/api/upload", { method: "POST", headers: { "X-Sift-Token": TOKEN },
                                             body: fd });
    if (!res.ok) {
      let msg = res.statusText;
      try { msg = (await res.json()).error || msg; } catch (_) {}
      throw new Error(msg);
    }
    const t = await res.json();
    await refreshState();
    await selectTable(t.table, true);
  } catch (e) { fail(e); }
}

/* ------------------------------------------------------------------ wire */
/* Panels yield to the grid as the window narrows, because the grid is the point.
     >=1040px  rail + grid + inspector, all in flow
     >=780px   grid + inspector; the rail floats on demand
     <780px    grid only; both panels float on demand, closed by default
   `open` holds what the user has explicitly asked for at the current breakpoint. */
const open = { rail: true, insp: true };
function autoLayout() {
  const w = window.innerWidth;
  const b = document.body.classList;
  if (NATIVE) {
    // AppKit owns the sidebar; the page only decides whether the inspector has its own column.
    open.rail = false;
    b.remove("float-rail", "no-rail");
    const floats = w < 700;
    b.toggle("float-insp", floats && open.insp);
    b.toggle("no-insp", !open.insp || (floats && !open.insp));
    $("tgl-insp").classList.toggle("on", open.insp);
    scheduleRender();
    return;
  }
  const railFloats = w < 1040, inspFloats = w < 780;

  b.toggle("float-rail", railFloats && open.rail);
  b.toggle("float-insp", inspFloats && open.insp);
  b.toggle("no-rail", railFloats && !open.rail);
  b.toggle("no-insp", inspFloats && !open.insp);
  if (!railFloats && !open.rail) b.add("no-rail");
  if (!inspFloats && !open.insp) b.add("no-insp");

  $("tgl-rail").classList.toggle("on", open.rail);
  $("tgl-insp").classList.toggle("on", open.insp);
  scheduleRender();
}
function setBreakpointDefaults() {
  // Floating panels start closed — an overlay that covers the grid on load is worse than no panel.
  const w = window.innerWidth;
  open.rail = !NATIVE && w >= 1040;
  open.insp = w >= (NATIVE ? 700 : 780);
}

function wire() {
  const gs = $("gscroll");
  gs.addEventListener("scroll", () => { onScroll(); $("ghead").scrollLeft = gs.scrollLeft;
    $("ghead-inner").style.transform = `translateX(${-gs.scrollLeft}px)`; });
  // No wheel handler on purpose — see the comment above keyNav. Native scrolling keeps its momentum.
  gs.tabIndex = 0;
  gs.addEventListener("keydown", keyNav);
  document.addEventListener("keydown", (e) => {
    // Global, so arrows work without clicking the grid first — but never while typing.
    if (["ArrowDown", "ArrowUp", "PageDown", "PageUp", "Home", "End"].includes(e.key)
        || (e.key === "g" && e.metaKey)) keyNav(e);
  });
  // Coalesced (via autoLayout's scheduleRender): dragging a window edge or the native sidebar
  // divider fires resize far faster than 60Hz, and each event used to rebuild every visible cell
  // synchronously. Crossing a breakpoint re-applies the defaults; resizing within one keeps the
  // user's choice.
  let lastW = window.innerWidth;
  window.addEventListener("resize", () => {
    const w = window.innerWidth;
    const bp = (x) => (x >= 1040 ? 2 : x >= 780 ? 1 : 0);
    if (bp(w) !== bp(lastW)) setBreakpointDefaults();
    lastW = w;
    autoLayout();
  });
  $("tgl-rail").onclick = () => {
    open.rail = !open.rail;
    if (open.rail && window.innerWidth < 780) open.insp = false;  // only one overlay at a time
    autoLayout();
  };
  $("tgl-insp").onclick = () => {
    open.insp = !open.insp;
    if (open.insp && window.innerWidth < 780) open.rail = false;
    autoLayout();
  };
  // Clicking the grid dismisses a floating panel, the usual drawer behaviour.
  $("gridwrap").addEventListener("mousedown", () => {
    const b = document.body.classList;
    if (b.contains("float-rail") || b.contains("float-insp")) {
      if (window.innerWidth < 1040) open.rail = false;
      if (window.innerWidth < 780) open.insp = false;
      autoLayout();
    }
  });

  document.querySelectorAll(".itab").forEach((t) => (t.onclick = () => {
    state.itab = t.dataset.itab; renderInspector();
  }));

  $("btn-openpath").onclick = () => { const v = $("pathbox").value.trim();
    $("pathbox").value = ""; openPath(v); };
  $("pathbox").onkeydown = (e) => { if (e.key === "Enter") $("btn-openpath").click(); };
  $("btn-staged").onclick = showStaged;
  $("btn-export").onclick = showExport;
  $("btn-merge").onclick = () => showMerge();

  $("btn-runsql").onclick = runSQL;
  $("btn-resetsql").onclick = async () => {
    try {
      const r = await post("/api/sqlexit", { table: state.active });
      state.sqlMode = false; $("sqlbox").value = r.sql;
      $("sqlstate").textContent = "mirrors the filters above";
      $("sqlstate").classList.remove("own");
      resetGrid(); await loadTable();
    } catch (e) { fail(e); }
  };
  $("sqlbox").addEventListener("input", () => {
    // Taking over the box is a one-way door: no attempt is made to parse SQL back into UI state,
    // because round-tripping SQL→filters is where tools like this go to die. Reset is the exit.
    $("sqlstate").textContent = "your SQL — filters and header controls are frozen";
    $("sqlstate").classList.add("own");
  });
  $("sqlbox").addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); runSQL(); }
  });

  const dz = $("dropzone");
  if (NATIVE) {
    // AppKit owns drops here and calls siftOpenPaths() with real paths. Swallow the browser's
    // default so a stray drop cannot navigate the web view away from the app.
    ["dragover", "drop"].forEach((ev) =>
      document.addEventListener(ev, (e) => e.preventDefault()));
  } else {
    ["dragenter", "dragover"].forEach((ev) => document.addEventListener(ev, (e) => {
      e.preventDefault(); setDropHint(true);
    }));
    ["dragleave", "drop"].forEach((ev) => document.addEventListener(ev, (e) => {
      if (ev === "dragleave" && e.relatedTarget) return;
      setDropHint(false);
    }));
    document.addEventListener("drop", async (e) => {
      e.preventDefault();
      for (const f of [...(e.dataTransfer?.files || [])]) await uploadFile(f);
    });
  }
  $("pathbox").addEventListener("paste", () => setTimeout(() => {
    const v = $("pathbox").value.trim();
    if (v.startsWith("/") && !v.includes("\n")) { $("pathbox").value = ""; openPath(v); }
  }, 0));

  document.addEventListener("keydown", (e) => {
    if (e.metaKey && e.key >= "1" && e.key <= "9") {
      const i = parseInt(e.key, 10) - 1;
      if (state.tables[i]) { e.preventDefault(); selectTable(state.tables[i].table); }
    }
  });
}

async function runSQL() {
  const sql = $("sqlbox").value;
  state.sqlMode = true;
  resetGrid();
  try {
    const d = await post("/api/sql", { table: state.active, sql, offset: 0, limit: BLOCK });
    state.cols = d.cols;
    state.blocks.set(0, d.rows);
    state.order = [0];
    state.total = d.rows.length < BLOCK ? d.rows.length : BLOCK + 1;
    renderHead(); renderGrid(); renderToolbar();
    toast(`${d.rows.length} rows in ${d.ms} ms`);
  } catch (e) { fail(e); }
}

/* ------------------------------------------------------------------- SSE */
function listen() {
  const es = new EventSource(`/api/events?t=${encodeURIComponent(TOKEN)}`);
  es.onmessage = async (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.type === "hello") { await refreshState(); if (state.active) await loadTable(); return; }
    if (["opened", "closed", "purged"].includes(m.type)) { await refreshState(); return; }
    if (["count", "counting", "state", "staging", "staged", "rejects"].includes(m.type)) {
      await refreshState();
      const t = state.tables.find((x) => x.table === state.active);
      if (m.table === state.active && t) {
        if (m.type === "staged") {
          // The relation was swapped view→native table, so cached rows are stale.
          state.blocks.clear(); state.order = [];
          state.total = t.rows.value || 0;
          await fetchBlock(Math.floor(state.firstRow / BLOCK));
          renderGrid();
        } else if (m.type === "count") {
          // An exact count changes only the scroll extent, not row contents — keep the blocks.
          state.total = t.rows.value || 0;
          renderGrid();
        }
      }
      return;
    }
    if (m.type === "profile" && m.table === state.active) { loadProfile(); return; }
    if (m.type === "error") { toast(m.msg || "engine error", true); await refreshState(); }
  };
  es.onerror = () => { /* EventSource retries on its own */ };
}

if (NATIVE) document.body.classList.add("native");
wire();
setBreakpointDefaults();
autoLayout();
listen();
refreshState().then(() => { if (state.active) loadTable(); }).catch(fail);
</script>
</body>
