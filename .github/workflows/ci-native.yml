name: CI (native)

on:
  pull_request:
  push:
    branches: [native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # This machine has only the macOS 26 SDK, so macos-15 is the only oracle for
      # SDK-version build breaks. latent hit two that were invisible locally.
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcrun --show-sdk-version

      - name: Fetch libduckdb
        run: ./scripts/fetch-duckdb.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The end-to-end surface that replaced browser mode: real files on disk, through the real
      # Session, with its own throwaway ~/.sift per check. Exits non-zero on any failure and
      # names every one. A check that cannot run here (no delta/excel extension on the runner)
      # reports `skip` and does not fail the build.
      - name: Verify end to end
        run: swift run sift --verify

      # P1-T0 CANARY — draft-PR probe, not for merge.
      #
      # Everything the `Test` step above runs is offline. This is the one place a cold
      # `INSTALL httpfs` / `INSTALL azure` from extensions.duckdb.org is exercised on
      # macos-15, and the one place the loopback test oracle has to bind a socket inside
      # the runner sandbox. `SIFT_REMOTE_FACTS` is scoped to this step, so the main suite
      # above stays exactly as it was: 732 tests, no network.
      - name: Remote facts canary (httpfs + azure)
        env:
          SIFT_REMOTE_FACTS: "1"
        run: swift test --filter remoteFact
